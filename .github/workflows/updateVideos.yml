name: Update Media Sections

on:
  workflow_dispatch:
  schedule:
    # UTC 00:00 = 北京时间 08:00
    - cron: '0 0 * * *'

jobs:
  update-media:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Point media sections at live SVG endpoints
        env:
          DOUBAN_USER_ID: itgoyo
        run: |
          python src/updateVideos.py README.md
          python src/updateDouban.py README.md

      - name: Commit changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff-index --quiet HEAD || git commit -m "chore: point media sections at live SVG endpoints"

      - name: Pull changes
        run: git pull -r

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
